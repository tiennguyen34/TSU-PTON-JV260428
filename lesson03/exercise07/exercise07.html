<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Form sở thích</title>
</head>
<body>

    <form>
        <table border="0" cellpadding="5">
            <tr>
                <th colspan="2" bgcolor="#FF4500" style="color: white;">SỞ THÍCH CỦA BẠN</th>
            </tr>
            <tr>
                <td align="right" style="color: blue;">Họ và tên</td>
                <td><input type="text" name="fullname" size="30"></td>
            </tr>
            <tr>
                <td align="right" style="color: blue;">Email</td>
                <td><input type="text" name="email" size="20"></td>
            </tr>
            <tr>
                <td align="right" valign="top" style="color: blue;">Sở thích</td>
                <td style="color: orange;">
                    <input type="checkbox"> Thể thao
                    <input type="checkbox"> Âm nhạc
                    <input type="checkbox"> Đọc sách <br>
                    <input type="checkbox"> Lướt web
                    <input type="checkbox"> Chơi game
                    <input type="checkbox"> Điện ảnh <br>
                    <input type="checkbox"> Du lịch
                </td>
            </tr>
            <tr>
                <td></td>
                <td>
                    <input type="submit" value="Gửi thông tin">
                    <input type="reset" value="Nhập lại">
                </td>
            </tr>
        </table>
    </form>

</body>
</html>
