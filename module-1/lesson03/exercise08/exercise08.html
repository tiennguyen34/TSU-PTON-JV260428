<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Liên Hệ Gọn Gàng</title>
</head>
<body>

    <h2>Liên Hệ Với Chúng Tôi</h2>

    <form>
        <p>Họ và tên:</p>
        <input type="text" name="name" size="30">

        <p>Email:</p>
        <input type="email" name="email" size="30">

        <p>Tin nhắn:</p>
        <textarea name="message" rows="6" cols="45"></textarea>

        <br><br>
        <input type="submit" value="Gửi">
    </form>

</body>
</html>
