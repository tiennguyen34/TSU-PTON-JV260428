<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiểm tra năm nhuận</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h2 {
            color: #1e293b;
            margin-bottom: 20px;
        }
        input[type="number"] {
            width: 80%;
            padding: 12px;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="number"]:focus {
            border-color: #3b82f6;
        }
        button {
            margin-top: 15px;
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #2563eb;
        }
        #result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }
        .leap-year {
            color: #16a34a;
        }
        .not-leap-year {
            color: #dc2626;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Kiểm Tra Năm Nhuận</h2>
        <input type="number" id="yearInput" placeholder="Nhập số năm cần kiểm tra...">
        <br>
        <button onclick="checkLeapYear()">Kiểm tra</button>
        <div id="result"></div>
    </div>

    <script src="exercise01.js"></script>
</body>
</html>
